[package]
name = "fast_tools"
version = "0.1.0"
edition = "2024"

[lib]
name = "fast_tools"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
pyox-tools = { path = "../../crates/pyox-tools" }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
