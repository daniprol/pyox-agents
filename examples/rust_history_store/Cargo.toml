[package]
name = "fast_history"
version = "0.1.0"
edition = "2024"

[lib]
name = "fast_history"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
pyox-tools = { path = "../../crates/pyox-tools" }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
