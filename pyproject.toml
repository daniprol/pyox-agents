[project]
name = "pyox-agents"
version = "0.1.0"
description = "Minimal and fast AI agents for Python, with a Rust core"
readme = "README.md"
authors = [{ name = "daniprol" }]
keywords = ["agents", "llm", "openai", "rust"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
requires-python = ">=3.11"
dependencies = []

[tool.maturin]
module-name = "pyox_agents._core"
python-packages = ["pyox_agents"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "crates/pyox-tools/src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[tool.uv.workspace]
members = [
    "examples/rust_tool_package",
    "examples/rust_history_store",
]

[tool.uv.sources]
fast-tools = { workspace = true }
fast-history = { workspace = true }

[dependency-groups]
dev = [
    "aiosqlite>=0.21",  # for examples/python_history.py
    "fast-history",
    "fast-tools",
    "maturin>=1.9",
    "prek>=0.5.7",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.14",
    "sqlalchemy[asyncio]>=2.0",  # for examples/python_history.py
    "ty>=0.0.1",
]
docs = ["zensical>=0.0.72"]  # uv run --only-group docs zensical serve

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # naming
    "UP",      # modern syntax for Python 3.11+
    "B",       # likely bugs
    "A",       # shadowing builtins
    "C4",      # comprehensions
    "SIM",     # simplifications
    "RET",     # return statements
    "PIE",     # misc. clean-ups
    "PTH",     # pathlib over os.path
    "PT",      # pytest style
    "ASYNC",   # asyncio pitfalls
    "RUF",     # ruff-specific
]

[tool.ty.src]
exclude = ["benchmarks"]  # a separate project with its own dependencies (see benchmarks/README.md)

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["pyox_agents"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
