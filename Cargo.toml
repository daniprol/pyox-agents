[package]
name = "pyox_agents"
version = "0.1.0"
edition = "2024"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "macros", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
futures = "0.3.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
pyox-tools = { path = "crates/pyox-tools" }
schemars = "1.2"
# WebSocket framing only: the connection itself is opened by reqwest (see `src/ws.rs`).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[workspace]
members = [".", "crates/pyox-tools", "examples/rust_tool_package", "examples/rust_history_store"]
