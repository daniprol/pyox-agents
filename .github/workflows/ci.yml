name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:  # release.yml reruns these checks on the tagged commit

jobs:
  checks:
    name: Checks and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      # The AI SDK and AG-UI tests check our streams with the official JavaScript clients.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/protocol_clients/package-lock.json
      - run: npm ci --prefix tests/protocol_clients
      # The same hooks developers run on commit and on push (see prek.toml).
      - name: Commit hooks (ruff, cargo fmt, file checks)
        run: uv run --frozen prek run --all-files --show-diff-on-failure
      - name: Push hooks (ty, clippy, cargo test, pytest)
        run: uv run --frozen prek run --all-files --stage pre-push

  coverage:
    name: Coverage (Python and Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      # The AI SDK and AG-UI tests check our streams with the official JavaScript clients.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/protocol_clients/package-lock.json
      - run: npm ci --prefix tests/protocol_clients
      # Build the Rust extension with coverage instrumentation, so the Python
      # tests also measure which Rust lines they run.
      - name: Run tests with coverage
        run: |
          eval "$(cargo llvm-cov show-env --sh)"
          cargo llvm-cov clean --workspace
          scripts/cargo-test.sh --workspace
          uv run --frozen --no-sync maturin develop --uv
          echo '### Python coverage' >> $GITHUB_STEP_SUMMARY
          uv run --frozen --no-sync pytest --cov --cov-report=term --cov-report=xml --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
          cargo llvm-cov report --lcov --output-path rust-coverage.lcov
          { echo '### Rust coverage'; echo '```text'; cargo llvm-cov report --summary-only; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            rust-coverage.lcov

  live:
    name: Live tests (Azure OpenAI)
    # Never on pull requests, so the key is not exposed to code from forks; and only after the
    # offline checks pass, so a broken build spends no tokens.
    # Not on release tags either: that commit already ran the live tests when it was pushed.
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `live` environment holds the key and only allows main and dev.
    environment: live
    concurrency:
      group: live-${{ github.ref }}
      cancel-in-progress: true
    env:
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      LIVE_MODEL: ${{ vars.LIVE_MODEL }}
      # How many live tests run at once. Keep it low: the deployment has a small tokens-per-minute quota.
      LIVE_TEST_WORKERS: 1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run live tests
        run: uv run --frozen pytest -m live -v --numprocesses $LIVE_TEST_WORKERS
